<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1700" viewBox="0 0 1280 1700">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 z" fill="#8fa3b8"/></marker></defs>
<rect width="1280" height="1700" fill="#f7f9fc"/>
<text x="60" y="52" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#1f2d3d">改造后：冲突预检 + 人工签核的目标流程（对照 REQ-1~REQ-6）</text>
<text x="60" y="80" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#6b7c8f">AI 只做「发现与举证」，人做「判定与签核」；冲突必须进人工队列，工单含触发原因/接手人/确认时间三硬字段</text>

<rect x="450" y="108" width="380" height="58" rx="10" fill="#eef4fb" stroke="#c9d6e4" stroke-width="1.6"/><text x="640.0" y="142.25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" font-weight="600">商家提交上架申请</text>
<path d="M640,166 L640,200" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="430" y="200" width="420" height="72" rx="10" fill="#e8f4ea" stroke="#5aa469" stroke-width="1.6"/><text x="640.0" y="229.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >数据质量门（REQ-2）</text><text x="640.0" y="252.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">主编号完整性 / 单位归一化 / 证书效期标注</text>
<path d="M640,272 L640,306" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="430" y="306" width="420" height="78" rx="10" fill="#e8f4ea" stroke="#5aa469" stroke-width="1.6"/><text x="640.0" y="338.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >AI 属性冲突预检（REQ-1）</text><text x="640.0" y="361.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">跨字段比对：电压/功率/容量/型号覆盖｜只读、只提示</text>
<path d="M640,384 L640,424" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<polygon points="640,424.0 800.0,480 640,536.0 480.0,480" fill="#fdf3e3" stroke="#e8b96a" stroke-width="1.6"/><text x="640" y="484.9" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#1f2d3d">是否检出属性冲突？</text>
<path d="M800,480 L930,480" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" /><text x="871.0" y="474.0" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">否</text>
<rect x="930" y="440" width="270" height="80" rx="10" fill="#eaf0fd" stroke="#5b7fd4" stroke-width="1.6"/><text x="1065.0" y="473.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >人工复核 + 岗位签核（REQ-4）</text><text x="1065.0" y="496.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">按品类授权清单，不得借用账号</text>
<path d="M1065,520 L1065,566" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="930" y="566" width="270" height="66" rx="10" fill="#eaf0fd" stroke="#5b7fd4" stroke-width="1.6"/><text x="1065.0" y="592.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >生成确认单 → 签核放行</text><text x="1065.0" y="615.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">确认单绑定签核人与时间</text>
<path d="M1065,632 L1065,676" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="930" y="676" width="270" height="60" rx="10" fill="#eef4fb" stroke="#c9d6e4" stroke-width="1.6"/><text x="1065.0" y="711.25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" font-weight="600">商品上架 + 审计留痕</text>
<text x="930" y="758" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b7c8f">审计留痕：谁 / 何时 / AI 给了什么建议 / 人是否覆盖</text>
<path d="M640,536 L640,578" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" /><text x="646.0" y="551.0" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">是</text>
<rect x="430" y="578" width="420" height="84" rx="10" fill="#fdecec" stroke="#d9736f" stroke-width="1.6"/><text x="640.0" y="613.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >转人工处置队列（REQ-3）</text><text x="640.0" y="636.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">工单三硬字段：触发原因 / 接手人 / 确认时间</text>
<path d="M640,662 L640,702" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="430" y="702" width="420" height="78" rx="10" fill="#eaf0fd" stroke="#5b7fd4" stroke-width="1.6"/><text x="640.0" y="734.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >内容审核员判定：以哪份资料为准</text><text x="640.0" y="757.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">AI 不代为判断哪边数值正确</text>
<path d="M640,780 L640,820" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<polygon points="640,825.0 800.0,878 640,931.0 480.0,878" fill="#fdf3e3" stroke="#e8b96a" stroke-width="1.6"/><text x="640" y="882.9" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#1f2d3d">能否直接判定？</text>
<path d="M480,878 L300,878" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" /><text x="396.0" y="872.0" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">否</text>
<rect x="60" y="840" width="240" height="80" rx="10" fill="#fdecec" stroke="#d9736f" stroke-width="1.6"/><text x="180.0" y="873.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >退回商家整改</text><text x="180.0" y="896.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">原因写清字段与两份资料</text>
<path d="M180,920 L180,348 L430,348" fill="none" stroke="#8fa3b8" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="192" y="1000" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">整改后复检</text>
<path d="M640,931 L640,972" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" /><text x="646.0" y="945.5" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">是</text>
<rect x="430" y="972" width="420" height="74" rx="10" fill="#eaf0fd" stroke="#5b7fd4" stroke-width="1.6"/><text x="640.0" y="1002.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >审核员签核 + 填写工单确认时间</text><text x="640.0" y="1025.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">确认单闭环，重复确认拒绝</text>
<path d="M850,1009 L1235,1009 L1235,480 L1200,480" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="880" y="1002" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">工单闭环后转入人工复核</text>
<text x="60" y="1075" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#1f2d3d">贯穿护栏（每一环节都生效）</text>
<rect x="60" y="1097" width="1160" height="52" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.3"/>
<text x="80" y="1119" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" font-weight="600" fill="#1f2d3d">REQ-1 冲突预检</text>
<text x="80" y="1138" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">只提示不处置；输出字段位置与两个数值，供人工核对</text>
<rect x="60" y="1159" width="1160" height="52" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.3"/>
<text x="80" y="1181" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" font-weight="600" fill="#1f2d3d">REQ-3 转人工兜底</text>
<text x="80" y="1200" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">冲突/资质临期/低置信度一律入队；工单缺三硬字段不算闭环</text>
<rect x="60" y="1221" width="1160" height="52" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.3"/>
<text x="80" y="1243" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" font-weight="600" fill="#1f2d3d">REQ-4 授权与签核</text>
<text x="80" y="1262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">按品类列出签核人；AI 不得放行、不得驳回、不得代替签核</text>
<rect x="60" y="1283" width="1160" height="52" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.3"/>
<text x="80" y="1305" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" font-weight="600" fill="#1f2d3d">REQ-5 快照兜底</text>
<text x="80" y="1324" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">知识/数据带时间戳，超周期标「暂未更新」，不冒充实时</text>
<rect x="60" y="1345" width="1160" height="52" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.3"/>
<text x="80" y="1367" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" font-weight="600" fill="#1f2d3d">REQ-6 指标口径</text>
<text x="80" y="1386" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">固定分母（失败计入不剔除）；效率与责任双轨，禁止压单</text>
<text x="60" y="1425" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6b7c8f">注：需求编号对应《业务需求发现报告》REQ-1~REQ-6；本流程图与系统实现（app/tools.py、app/agent/、/admin/tasks）逐节点一致。</text>
<rect x="60" y="1455" width="14" height="14" rx="3" fill="#eef4fb" stroke="#c9d6e4"/><text x="80" y="1466" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">开始/结束</text><rect x="60" y="1477" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9d6e4"/><text x="80" y="1488" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">处理步骤</text><rect x="60" y="1499" width="14" height="14" rx="3" fill="#fdf3e3" stroke="#e8b96a"/><text x="80" y="1510" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">判断</text><rect x="60" y="1521" width="14" height="14" rx="3" fill="#e8f4ea" stroke="#5aa469"/><text x="80" y="1532" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">AI 环节（只读提示）</text><rect x="60" y="1543" width="14" height="14" rx="3" fill="#eaf0fd" stroke="#5b7fd4"/><text x="80" y="1554" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">人工签核</text><rect x="60" y="1565" width="14" height="14" rx="3" fill="#fdecec" stroke="#d9736f"/><text x="80" y="1576" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">异常/转人工</text>
</svg>