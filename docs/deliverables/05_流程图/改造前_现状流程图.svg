<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1140" viewBox="0 0 1280 1140">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 z" fill="#8fa3b8"/></marker></defs>
<rect width="1280" height="1140" fill="#f7f9fc"/>
<text x="60" y="52" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#1f2d3d">改造前：商品上架与资料审核现状流程</text>
<text x="60" y="80" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13.5" fill="#6b7c8f">痛点集中在人工跨资料核验（占审核时间约 60%）与反复退回；冲突时以哪份资料为准无明文，责任链靠人盯</text>

<rect x="470" y="110" width="340" height="60" rx="10" fill="#eef4fb" stroke="#c9d6e4" stroke-width="1.6"/><text x="640.0" y="145.25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" font-weight="600">商家提交上架申请</text>
<path d="M640,170 L640,205" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="470" y="205" width="340" height="64" rx="10" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.6"/><text x="640.0" y="230.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >系统基础校验（必填/格式）</text><text x="640.0" y="253.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">不做跨资料语义比对</text>
<path d="M640,269 L640,304" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="430" y="304" width="420" height="76" rx="10" fill="#eaf0fd" stroke="#5b7fd4" stroke-width="1.6"/><text x="640.0" y="335.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >人工审核：逐项比对四类资料</text><text x="640.0" y="358.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">规格表 / 图片 / 说明书 / 证书覆盖型号（约 60% 时间）</text>
<path d="M640,380 L640,425" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<polygon points="640,425.0 790.0,480 640,535.0 490.0,480" fill="#fdf3e3" stroke="#e8b96a" stroke-width="1.6"/><text x="640" y="484.9" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#1f2d3d">资料是否一致？</text>
<path d="M790,480 L930,480" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" /><text x="866.0" y="474.0" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">一致</text>
<rect x="930" y="448" width="250" height="64" rx="10" fill="#eef4fb" stroke="#c9d6e4" stroke-width="1.6"/><text x="1055.0" y="485.25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >审核通过 → 商品上架</text>
<path d="M640,535 L640,585" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" /><text x="646.0" y="554.0" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">不一致</text>
<rect x="455" y="585" width="370" height="70" rx="10" fill="#fdecec" stroke="#d9736f" stroke-width="1.6"/><text x="640.0" y="625.25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >按流程退回原步骤（必须写退回原因）</text>
<path d="M640,655 L640,700" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="470" y="700" width="340" height="62" rx="10" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.6"/><text x="640.0" y="736.25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >商家修改资料后重新提交</text>
<path d="M470,731 L150,731 L150,237 L470,237" fill="none" stroke="#8fa3b8" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="160" y="700" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">反复退回 2–3 轮</text>
<text x="160" y="684" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#5d6f82">同一商品多次退回，原因散落</text>
<path d="M640,762 L640,800" fill="none" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="455" y="800" width="370" height="66" rx="10" fill="#fdecec" stroke="#d9736f" stroke-width="1.6"/><text x="640.0" y="826.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#1f2d3d" >谁接手复核？改完哪份算闭环？</text><text x="640.0" y="849.75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#6b7c8f">制度未写死 → 靠人盯</text>
<text x="760" y="571" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#8a6d1f">现状五个痛点（访谈核对）</text>
<rect x="760" y="585" width="440" height="80" rx="8" fill="#fff8e6" stroke="#d9a441" stroke-width="1.3"/>
<text x="774" y="609" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1f2d3d">1. 判定权不明</text>
<text x="774" y="629" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">冲突时以哪份资料为准没有写死，</text>
<text x="774" y="647" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">AI 与人都不敢定案</text>
<rect x="760" y="677" width="440" height="80" rx="8" fill="#fff8e6" stroke="#d9a441" stroke-width="1.3"/>
<text x="774" y="701" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1f2d3d">2. 责任链断裂</text>
<text x="774" y="721" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">退回后接手人不明、闭环标准缺失，</text>
<text x="774" y="739" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">交接责任无从追溯</text>
<rect x="760" y="769" width="440" height="80" rx="8" fill="#fff8e6" stroke="#d9a441" stroke-width="1.3"/>
<text x="774" y="793" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1f2d3d">3. 记录分散</text>
<text x="774" y="813" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">同一商品多次退回，原因散在</text>
<text x="774" y="831" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">不同记录里，交接易漏</text>
<rect x="760" y="861" width="440" height="80" rx="8" fill="#fff8e6" stroke="#d9a441" stroke-width="1.3"/>
<text x="774" y="885" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1f2d3d">4. 数据口径不一</text>
<text x="774" y="905" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">220V / AC220V / 输出电压混填，</text>
<text x="774" y="923" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">证书过期未标注</text>
<rect x="760" y="953" width="440" height="80" rx="8" fill="#fff8e6" stroke="#d9a441" stroke-width="1.3"/>
<text x="774" y="977" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1f2d3d">5. 无可观测指标</text>
<text x="774" y="997" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">按商品还是按工单计未定，</text>
<text x="774" y="1015" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" fill="#6b5a2e">只考核退回数会诱发压单</text>
<rect x="60" y="900" width="14" height="14" rx="3" fill="#eef4fb" stroke="#c9d6e4"/><text x="80" y="911" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">开始/结束</text><rect x="60" y="922" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9d6e4"/><text x="80" y="933" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">处理步骤</text><rect x="60" y="944" width="14" height="14" rx="3" fill="#fdf3e3" stroke="#e8b96a"/><text x="80" y="955" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">判断</text><rect x="60" y="966" width="14" height="14" rx="3" fill="#e8f4ea" stroke="#5aa469"/><text x="80" y="977" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">AI 环节（只读提示）</text><rect x="60" y="988" width="14" height="14" rx="3" fill="#eaf0fd" stroke="#5b7fd4"/><text x="80" y="999" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">人工签核</text><rect x="60" y="1010" width="14" height="14" rx="3" fill="#fdecec" stroke="#d9736f"/><text x="80" y="1021" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f82">异常/转人工</text>
<text x="60" y="1080" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#6b7c8f">注：本图依据六人访谈记录绘制；退回率 31%、初审 18 分钟为需求发现报告口径，基线仍待样本验证。</text>
</svg>